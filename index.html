<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2WIN HUNTER</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
        #chart { width: 100vw; height: 100vh; }
    </style>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="chart"></div>
    <script>
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            width: window.innerWidth,
            height: window.innerHeight,
            layout: { backgroundColor: '#ffffff', textColor: '#333' },
            grid: { vertLines: { color: '#f0f0f0' }, horzLines: { color: '#f0f0f0' } },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#000000',
            downColor: '#ff0000',
            borderVisible: false,
            wickUpColor: '#000000',
            wickDownColor: '#ff0000',
        });

        // የናሙና መረጃ
        candleSeries.setData([
            { time: '2026-05-25', open: 4450, high: 4460, low: 4430, close: 4453 },
            { time: '2026-05-26', open: 4453, high: 4470, low: 4440, close: 4465 },
            { time: '2026-05-27', open: 4465, high: 4480, low: 4450, close: 4475 }
        ]);
    </script>
</body>
</html>
