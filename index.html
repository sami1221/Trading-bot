<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>2WIN HUNTER CHART</title>
    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; }
        #chart { width: 100vw; height: 100vh; }
    </style>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="chart"></div>
    <script>
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            width: window.innerWidth,
            height: window.innerHeight,
            layout: { backgroundColor: '#ffffff', textColor: '#333' },
            grid: { vertLines: { color: '#eee' }, horzLines: { color: '#eee' } },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#000000', // Bullish በጥቁር
            downColor: '#ff0000', // Bearish በቀይ
            borderVisible: false,
            wickUpColor: '#000000',
            wickDownColor: '#ff0000',
        });

        // የቻርት መረጃ (ይህንን የፈለጉትን ዳታ ማስገባት ይችላሉ)
        candleSeries.setData([
            { time: '2026-05-25', open: 1.08, high: 1.09, low: 1.07, close: 1.085 },
            { time: '2026-05-26', open: 1.085, high: 1.10, low: 1.08, close: 1.09 },
            { time: '2026-05-27', open: 1.09, high: 1.11, low: 1.085, close: 1.105 }
        ]);
    </script>
</body>
</html>
