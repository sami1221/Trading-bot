<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Gold Signal — የወርቅ ምልክት</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110F;
    --bg-card:#1E1814;
    --bg-card-2:#241D17;
    --gold:#D4AF37;
    --gold-bright:#F0CE6A;
    --text:#F2E9DC;
    --muted:#9C9189;
    --green:#5FAE7B;
    --red:#D1604A;
    --border:rgba(212,175,55,0.16);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:radial-gradient(120% 100% at 50% -10%, #221C16 0%, #14110F 55%, #0F0D0B 100%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:22px 18px 60px;
  }
  /* HEADER */
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.28em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:32px;
    line-height:1.1;
    color:var(--gold-bright);
    margin-bottom:4px;
  }
  .sub{
    font-size:13px;
    color:var(--muted);
    margin-bottom:22px;
  }

  /* PRICE CARD */
  .price-card{
    background:linear-gradient(160deg, var(--bg-card-2), var(--bg-card));
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px 20px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .price-card::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(135deg, rgba(212,175,55,0.04) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .price-label{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.14em;
    margin-bottom:8px;
  }
  .price-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .price-value{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:46px;
    color:var(--text);
    letter-spacing:0.01em;
  }
  .price-unit{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
  }
  .price-meta{
    margin-top:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .pulse-dot{
    display:inline-block;
    width:7px; height:7px;
    border-radius:50%;
    background:var(--green);
    margin-right:6px;
    box-shadow:0 0 0 0 rgba(95,174,123,0.6);
    animation:pulse 2s infinite;
    vertical-align:middle;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(95,174,123,0.5); }
    70%{ box-shadow:0 0 0 6px rgba(95,174,123,0); }
    100%{ box-shadow:0 0 0 0 rgba(95,174,123,0); }
  }

  /* BUTTON */
  .btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:16px;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
    cursor:pointer;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold) 70%);
    color:#1A1410;
    transition:transform 0.15s ease, opacity 0.15s ease;
    margin-bottom:18px;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .btn .spinner{
    display:inline-block;
    width:14px; height:14px;
    border:2px solid rgba(26,20,16,0.3);
    border-top-color:#1A1410;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    vertical-align:middle;
    margin-right:8px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* GAUGE / SIGNATURE ELEMENT */
  .gauge-card{
    background:linear-gradient(160deg, var(--bg-card-2), var(--bg-card));
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px 20px 14px;
    margin-bottom:16px;
    text-align:center;
  }
  .gauge-title{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.14em;
    margin-bottom:6px;
  }
  .gauge-wrap{
    position:relative;
    width:240px;
    margin:8px auto 0;
  }
  .needle{
    transform-origin: 120px 120px;
    transition: transform 1.1s cubic-bezier(.34,1.56,.64,1);
  }
  .signal-label{
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:30px;
    margin-top:-26px;
  }
  .signal-buy{ color:var(--green); }
  .signal-sell{ color:var(--red); }
  .signal-hold{ color:var(--gold-bright); }
  .confidence{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
    margin-bottom:6px;
  }

  /* ANALYSIS CARD */
  .analysis-card{
    background:linear-gradient(160deg, var(--bg-card-2), var(--bg-card));
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
  }
  .analysis-card h3{
    font-family:'Playfair Display', serif;
    font-size:17px;
    color:var(--gold-bright);
    margin-bottom:10px;
    font-weight:700;
  }
  .analysis-text{
    font-size:14px;
    line-height:1.7;
    color:var(--text);
  }

  /* NEWS LIST */
  .news-card{
    background:linear-gradient(160deg, var(--bg-card-2), var(--bg-card));
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
  }
  .news-card h3{
    font-family:'Playfair Display', serif;
    font-size:17px;
    color:var(--gold-bright);
    margin-bottom:12px;
    font-weight:700;
  }
  .news-item{
    padding:12px 0;
    border-top:1px solid var(--border);
    font-size:13.5px;
    line-height:1.5;
  }
  .news-item:first-child{ border-top:none; padding-top:0; }
  .news-source{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-top:4px;
  }

  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    line-height:1.6;
    padding-top:6px;
  }
  .error{
    background:rgba(209,96,74,0.12);
    border:1px solid rgba(209,96,74,0.35);
    color:#E6A493;
    border-radius:14px;
    padding:14px 16px;
    font-size:13px;
    margin-bottom:16px;
  }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">XAU / USD &nbsp;·&nbsp; LIVE</div>
  <h1>የወርቅ ምልክት</h1>
  <div class="sub">የአሁኑ የወርቅ ዋጋ፣ ዜና ትንታኔ እና የግብይት ምልክት</div>

  <!-- PRICE CARD -->
  <div class="price-card">
    <div class="price-label">የአንድ አውንስ ዋጋ (Spot)</div>
    <div class="price-row">
      <span class="price-value" id="priceValue">--.--</span>
      <span class="price-unit">USD / oz</span>
    </div>
    <div class="price-meta">
      <span><span class="pulse-dot" id="pulseDot"></span><span id="priceStatus">በመጫን ላይ...</span></span>
      <span id="priceTime">--</span>
    </div>
  </div>

  <div id="errorBox" class="error hidden"></div>

  <!-- BUTTON -->
  <button class="btn" id="analyzeBtn" onclick="runAnalysis()">ትንታኔ እና ምልክት አግኝ</button>

  <!-- GAUGE -->
  <div class="gauge-card hidden" id="gaugeCard">
    <div class="gauge-title">የግብይት ምልክት</div>
    <div class="gauge-wrap">
      <svg viewBox="0 0 240 140" width="240" height="140">
        <defs>
          <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#D1604A"/>
            <stop offset="50%" stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#5FAE7B"/>
          </linearGradient>
        </defs>
        <path d="M 20 120 A 100 100 0 0 1 220 120" fill="none" stroke="url(#gaugeGrad)" stroke-width="14" stroke-linecap="round"/>
        <g class="needle" id="needle">
          <line x1="120" y1="120" x2="120" y2="32" stroke="#F2E9DC" stroke-width="3" stroke-linecap="round"/>
          <circle cx="120" cy="120" r="7" fill="#F2E9DC"/>
        </g>
        <text x="22" y="138" fill="#D1604A" font-family="JetBrains Mono" font-size="10" text-anchor="start">ሽያጭ</text>
        <text x="120" y="20" fill="#D4AF37" font-family="JetBrains Mono" font-size="10" text-anchor="middle">ጠብቅ</text>
        <text x="218" y="138" fill="#5FAE7B" font-family="JetBrains Mono" font-size="10" text-anchor="end">ግዢ</text>
      </svg>
    </div>
    <div class="signal-label" id="signalLabel">--</div>
    <div class="confidence" id="confidenceLabel">እምነት: --%</div>
  </div>

  <!-- ANALYSIS -->
  <div class="analysis-card hidden" id="analysisCard">
    <h3>ትንታኔ</h3>
    <div class="analysis-text" id="analysisText"></div>
  </div>

  <!-- NEWS -->
  <div class="news-card hidden" id="newsCard">
    <h3>ተያያዥ ዜናዎች</h3>
    <div id="newsList"></div>
  </div>

  <div class="footnote">
    ይህ መረጃ ለትምህርት ብቻ የቀረበ ነው፣ የፋይናንስ ምክር አይደለም።<br>
    ዋጋዎች ከ gold-api.com ይመጣሉ፣ ትንታኔው በ AI የተደገፈ ድረ-ገጽ ፍለጋ ነው።
  </div>

</div>

<script>
  // Telegram WebApp init
  try{
    if(window.Telegram && window.Telegram.WebApp){
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  }catch(e){}

  let currentPrice = null;

  function setError(msg){
    const box = document.getElementById('errorBox');
    if(!msg){ box.classList.add('hidden'); return; }
    box.textContent = msg;
    box.classList.remove('hidden');
  }

  async function loadPrice(){
    try{
      const res = await fetch('https://api.gold-api.com/price/XAU');
      if(!res.ok) throw new Error('price fetch failed');
      const data = await res.json();
      currentPrice = data.price;
      document.getElementById('priceValue').textContent =
        Number(currentPrice).toLocaleString('en-US', {maximumFractionDigits:2, minimumFractionDigits:2});
      document.getElementById('priceStatus').textContent = 'ቀጥታ ዋጋ';
      document.getElementById('priceTime').textContent =
        new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    }catch(err){
      document.getElementById('priceStatus').textContent = 'ዋጋ ማግኘት አልተቻለም';
      document.getElementById('pulseDot').style.background = 'var(--red)';
      document.getElementById('priceValue').textContent = '—';
    }
  }

  function setNeedle(score){
    // score: -100 (strong sell) to 100 (strong buy) -> angle -85deg to 85deg
    const angle = (score/100) * 85;
    document.getElementById('needle').style.transform = `rotate(${angle}deg)`;
  }

  function renderSignal(result){
    const map = {
      'ግዢ': {cls:'signal-buy'},
      'ሽያጭ': {cls:'signal-sell'},
      'ጠብቅ': {cls:'signal-hold'}
    };
    const sig = result.signal || 'ጠብቅ';
    const info = map[sig] || map['ጠብቅ'];
    const label = document.getElementById('signalLabel');
    label.textContent = sig;
    label.className = 'signal-label ' + info.cls;
    document.getElementById('confidenceLabel').textContent = `እምነት: ${result.confidence ?? '--'}%`;

    let score = result.score;
    if(typeof score !== 'number'){
      score = sig === 'ግዢ' ? 50 : sig === 'ሽያጭ' ? -50 : 0;
    }
    setNeedle(score);
    document.getElementById('gaugeCard').classList.remove('hidden');

    document.getElementById('analysisText').textContent = result.summary || '';
    document.getElementById('analysisCard').classList.remove('hidden');

    const newsList = document.getElementById('newsList');
    newsList.innerHTML = '';
    if(Array.isArray(result.news) && result.news.length){
      result.news.forEach(n=>{
        const item = document.createElement('div');
        item.className = 'news-item';
        item.innerHTML = `${n.title || ''}<span class="news-source">${n.source || ''}</span>`;
        newsList.appendChild(item);
      });
      document.getElementById('newsCard').classList.remove('hidden');
    }
  }

  function extractJson(text){
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    if(start === -1 || end === -1) throw new Error('no json found');
    return JSON.parse(text.slice(start, end+1));
  }

  async function runAnalysis(){
    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>ዜናዎችን በመፈለግ ላይ...';
    setError(null);

    const priceText = currentPrice
      ? `የአሁኑ የወርቅ ዋጋ በግምት $${Number(currentPrice).toFixed(2)} ለአንድ አውንስ ነው።`
      : `የአሁኑን የወርቅ ዋጋ ራስህ ፍለግ።`;

    const prompt = `አንተ ልምድ ያለው የወርቅ (XAU/USD) ማርኬት ተንታኝ ነህ።
${priceText}
የቅርብ ጊዜ ዜናዎችን ፍለግ፡ የFed የወለድ ምጣኔ ውሳኔዎች፣ የዶላር አቅም፣ የዋጋ ግሽበት (inflation) ቁጥሮች፣ የጂኦፖለቲካዊ ውጥረቶች፣ እና ሌላ ለወርቅ ዋጋ ተፅዕኖ የሚያደርግ ወሳኝ ዜና። ከዚያ መሠረት የግብይት ምልክት ስጥ።

ምላሽህ ሙሉ በሙሉ valid JSON ብቻ መሆን አለበት፣ ምንም markdown ምልክት፣ ምንም መግቢያ ጽሁፍ ሳይኖር፣ በዚህ ቅርጽ፡
{
  "signal": "ግዢ" | "ሽያጭ" | "ጠብቅ",
  "score": -100 እስከ 100 ያለ integer (negative ለሽያጭ፣ positive ለግዢ፣ 0 አካባቢ ለጠብቅ),
  "confidence": 0 እስከ 100 ያለ integer,
  "summary": "ለምን ይህ ምልክት እንደተሰጠ የሚገልጽ 2-3 አጫጭር የአማርኛ ዓረፍተ ነገሮች",
  "news": [ {"title": "የዜናው አጭር ርዕስ በአማርኛ", "source": "የምንጩ ስም"} ] (እስከ 3 ዜናዎች)
}`;

    try{
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
          messages: [{ role: 'user', content: prompt }]
        })
      });

      if(!res.ok) throw new Error('API error ' + res.status);
      const data = await res.json();
      const text = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n');

      const result = extractJson(text);
      renderSignal(result);

    }catch(err){
      setError('ትንታኔ ማግኘት አልተቻለም። እንደገና ይሞክሩ።');
      console.error(err);
    }finally{
      btn.disabled = false;
      btn.textContent = 'ድጋሚ ትንታኔ አግኝ';
    }
  }

  loadPrice();
</script>
</body>
</html>
