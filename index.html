<script>

const WS_URL = "wss://ws.binaryws.com/websockets/v3?app_id=1089";
const SYMBOL = "frxXAUUSD";

let ticks = [], candles = [], currentTF = 10;
let candleBuilder = {open:null,high:-Infinity,low:Infinity,close:null,count:0,time:null};
let lastSig = null, ws = null;

// ── Canvas setup ──────────────────────────────────────────
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = 280 * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = '280px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
  drawChart();
}
window.addEventListener('resize', resizeCanvas);

// ── SMC logic ─────────────────────────────────────────────
function calcEMA(vals, p){
  if(vals.length<p)return null;
  const k=2/(p+1); let e=vals.slice(0,p).reduce((a,b)=>a+b,0)/p;
  for(let i=p;i<vals.length;i++) e=vals[i]*k+e*(1-k);
  return e;
}
function calcRSI(c,p=14){
  if(c.length<p+1)return null;
  let g=0,l=0;
  for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d;}
  const ag=g/p,al=l/p; return al===0?100:100-100/(1+ag/al);
}
function findSwings(cs,left=2,right=2){
  const h=[],l=[];
  for(let i=left;i<cs.length-right;i++){
    let isH=true,isL=true;
    for(let j=i-left;j<=i+right;j++){
      if(j===i)continue;
      if(cs[j].high>=cs[i].high)isH=false;
      if(cs[j].low<=cs[i].low)isL=false;
    }
    if(isH)h.push({price:cs[i].high,index:i});
    if(isL)l.push({price:cs[i].low,index:i});
  }
  return{highs:h,lows:l};
}
function detectStructure(highs,lows){
  let bias="NEUTRAL",event=null;
  if(highs.length>=2){
    const l=highs[highs.length-1],p=highs[highs.length-2];
    if(l.price>p.price){bias="BULLISH";event="BOS";}
    else if(l.price<p.price){bias="BEARISH";event="CHoCH";}
  }
  if(lows.length>=2){
    const l=lows[lows.length-1],p=lows[lows.length-2];
    if(l.price<p.price&&bias!=="BULLISH"){bias="BEARISH";event="BOS";}
    else if(l.price>p.price){bias="BULLISH";event="CHoCH";}
  }
  return{bias,event};
}
function findOrderBlocks(cs){
  const obs=[];
  for(let i=2;i<cs.length-2;i++){
    const c=cs[i],nx=cs[i+1];
    const body=Math.abs(c.close-c.open),nxBody=Math.abs(nx.close-nx.open);
    if(c.close<c.open&&nx.close>nx.open&&nxBody>body*1.3)
      obs.push({type:"BULL",top:c.open,bottom:c.close,index:i});
    if(c.close>c.open&&nx.close<nx.open&&nxBody>body*1.3)
      obs.push({type:"BEAR",top:c.close,bottom:c.open,index:i});
  }
  return obs.slice(-6);
}
function getPD(cs){
  const n=cs.slice(-50);
  const hi=Math.max(...n.map(c=>c.high)),lo=Math.min(...n.map(c=>c.low));
  const cur=cs[cs.length-1].close,pos=(cur-lo)/(hi-lo||1);
  return{hi,lo,pos:+(pos*100).toFixed(1),zone:pos>0.618?"PREMIUM":pos<0.382?"DISCOUNT":"EQUILIBRIUM"};
}
function runSMC(cs){
  if(cs.length<20)return null;
  const closes=cs.map(c=>c.close);
  const cur=closes[closes.length-1],prev=closes[closes.length-2];
  const{highs,lows}=findSwings(cs);
  const{bias,event}=detectStructure(highs,lows);
  const obs=findOrderBlocks(cs);
  const pd=getPD(cs);
  const rsi=calcRSI(closes);
  const ema9=calcEMA(closes,9),ema21=calcEMA(closes,21);
  let bull=0,bear=0,reasons=[];
  if(bias==="BULLISH"){bull+=3;reasons.push({t:`${event} — Bullish Structure`,s:"bull"});}
  else if(bias==="BEARISH"){bear+=3;reasons.push({t:`${event} — Bearish Structure`,s:"bear"});}
  obs.forEach(ob=>{
    if(ob.type==="BULL"&&cur>=ob.bottom-0.3&&cur<=ob.top+0.3){bull+=3;reasons.push({t:"Price at Bullish Order Block",s:"bull"});}
    if(ob.type==="BEAR"&&cur<=ob.top+0.3&&cur>=ob.bottom-0.3){bear+=3;reasons.push({t:"Price at Bearish Order Block",s:"bear"});}
  });
  if(pd.zone==="DISCOUNT"){bull+=2;reasons.push({t:"Discount Zone <38.2%",s:"bull"});}
  if(pd.zone==="PREMIUM"){bear+=2;reasons.push({t:"Premium Zone >61.8%",s:"bear"});}
  if(rsi!==null){
    if(rsi<35){bull+=1;reasons.push({t:`RSI Oversold (${rsi.toFixed(1)})`,s:"bull"});}
    if(rsi>65){bear+=1;reasons.push({t:`RSI Overbought (${rsi.toFixed(1)})`,s:"bear"});}
  }
  if(ema9&&ema21){
    if(ema9>ema21&&cur>ema9){bull+=1;reasons.push({t:"EMA9>EMA21 Bullish",s:"bull"});}
    if(ema9<ema21&&cur<ema9){bear+=1;reasons.push({t:"EMA9<EMA21 Bearish",s:"bear"});}
  }
  const net=bull-bear,total=bull+bear||1;
  const confidence=Math.round((Math.max(bull,bear)/total)*100);
  let signal="WAIT";
  if(net>=3)signal="BUY"; else if(net<=-3)signal="SELL";
  const atr=cs.slice(-14).reduce((acc,c,i,arr)=>{
    if(i===0)return acc;
    return acc+Math.max(c.high-c.low,Math.abs(c.high-arr[i-1].close),Math.abs(c.low-arr[i-1].close));
  },0)/13;
  const sl=signal==="BUY"?+(cur-atr*1.5).toFixed(2):+(cur+atr*1.5).toFixed(2);
  const tp1=signal==="BUY"?+(cur+atr*2).toFixed(2):+(cur-atr*2).toFixed(2);
  const tp2=signal==="BUY"?+(cur+atr*3.5).toFixed(2):+(cur-atr*3.5).toFixed(2);
  return{signal,confidence,bull,bear,reasons,entry:+cur.toFixed(2),sl,tp1,tp2,pd,rsi:rsi?.toFixed(1),obs,highs,lows,event,bias,atr:+atr.toFixed(2),change:+((cur-prev)/prev*100).toFixed(3)};
}

// ── Draw Chart ────────────────────────────────────────────
function drawChart(){
  const W=canvas.width/devicePixelRatio, H=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#131722"; ctx.fillRect(0,0,W,H);
  if(candles.length<2)return;

  const display=candles.slice(-60);
  const pad={l:8,r:60,t:20,b:20};
  const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;
  const n=display.length;
  const cw=Math.max(4,Math.floor(cW/n)-1);
  const gap=Math.max(1,Math.floor(cW/n)-cw);

  let hi=Math.max(...display.map(c=>c.high));
  let lo=Math.min(...display.map(c=>c.low));
  const range=hi-lo||1;
  hi+=range*0.05; const lo2=lo-range*0.05;
  const totalRange=hi-lo2;
  const toY=p=>pad.t+((hi-p)/totalRange)*cH;
  const toX=i=>pad.l+i*(cw+gap)+cw/2;

  // Grid
  ctx.strokeStyle="#1e222d"; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.t+i*(cH/4);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    const price=(hi-(i/4)*totalRange).toFixed(2);
    ctx.fillStyle="#4a5060"; ctx.font="9px 'Share Tech Mono'";
    ctx.fillText(price, W-pad.r+4, y+3);
  }

  // Order Blocks (behind candles)
  if(lastSig){
    lastSig.obs.forEach(ob=>{
      const startIdx=display.findIndex((_,i)=>i===ob.index-(candles.length-display.length));
      if(startIdx<0)return;
      const x=pad.l+startIdx*(cw+gap);
      const y1=toY(ob.top), y2=toY(ob.bottom);
      ctx.fillStyle=ob.type==="BULL"?"rgba(38,166,154,0.12)":"rgba(239,83,80,0.12)";
      ctx.fillRect(x,y1,cW-startIdx*(cw+gap),y2-y1);
      ctx.strokeStyle=ob.type==="BULL"?"rgba(38,166,154,0.5)":"rgba(239,83,80,0.5)";
      ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.strokeRect(x,y1,cW-startIdx*(cw+gap),y2-y1);
      ctx.setLineDash([]);
      ctx.fillStyle=ob.type==="BULL"?"#26a69a":"#ef5350";
      ctx.font="bold 8px 'Share Tech Mono'";
      ctx.fillText(ob.type==="BULL"?"OB↑":"OB↓", x+3, y1-3);
    });
  }

  // EMA lines
  const closes=display.map(c=>c.close);
  const ema9line=[], ema21line=[];
  for(let i=0;i<display.length;i++){
    const slice=closes.slice(0,i+1);
    const e9=calcEMA(slice,9), e21=calcEMA(slice,21);
    if(e9)ema9line.push({x:toX(i),y:toY(e9)});
    if(e21)ema21line.push({x:toX(i),y:toY(e21)});
  }
  const drawLine=(pts,col)=>{
    if(pts.length<2)return;
    ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=1.2;
    pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
  };
  drawLine(ema9line,"#f0b90b88");
  drawLine(ema21line,"#7b61ff88");

  // Candles
  display.forEach((c,i)=>{
    const x=pad.l+i*(cw+gap);
    const bull=c.close>=c.open;
    const col=bull?"#26a69a":"#ef5350";
    const oh=toY(Math.max(c.open,c.close));
    const cl=toY(Math.min(c.open,c.close));
    const bodyH=Math.max(1,cl-oh);
    // Wick
    ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x+cw/2,toY(c.high));
    ctx.lineTo(x+cw/2,toY(c.low));
    ctx.stroke();
    // Body
    ctx.fillStyle=col;
    ctx.fillRect(x,oh,cw,bodyH);
  });

  // BOS / CHoCH labels
  if(lastSig&&lastSig.event){
    // draw BOS line at last swing high/low
    if(lastSig.highs.length>=2){
      const sw=lastSig.highs[lastSig.highs.length-1];
      const dispIdx=sw.index-(candles.length-display.length);
      if(dispIdx>=0&&dispIdx<display.length){
        const y=toY(sw.price);
        ctx.strokeStyle="#f0b90b88"; ctx.lineWidth=1; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle="#f0b90b"; ctx.font="bold 9px 'Share Tech Mono'";
        const label=lastSig.bias==="BULLISH"?"BOS↑":"CHoCH";
        ctx.fillText(label, toX(dispIdx)-10, y-5);
      }
    }
    if(lastSig.lows.length>=2){
      const sw=lastSig.lows[lastSig.lows.length-1];
      const dispIdx=sw.index-(candles.length-display.length);
      if(dispIdx>=0&&dispIdx<display.length){
        const y=toY(sw.price);
        ctx.strokeStyle="#7b61ff88"; ctx.lineWidth=1; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle="#7b61ff"; ctx.font="bold 9px 'Share Tech Mono'";
        const label=lastSig.bias==="BEARISH"?"BOS↓":"CHoCH";
        ctx.fillText(label, toX(dispIdx)-10, y+12);
      }
    }
  }

  // BUY / SELL signal on last candle
  if(lastSig&&lastSig.signal!=="WAIT"){
    const i=display.length-1;
    const c=display[i];
    const x=toX(i);
    const isBuy=lastSig.signal==="BUY";
    const col=isBuy?"#26a69a":"#ef5350";
    const arrowY=isBuy?toY(c.low)+22:toY(c.high)-22;
    // Arrow
    ctx.fillStyle=col;
    ctx.beginPath();
    if(isBuy){
      ctx.moveTo(x,toY(c.low)+8);
      ctx.lineTo(x-7,toY(c.low)+18);
      ctx.lineTo(x+7,toY(c.low)+18);
    } else {
      ctx.moveTo(x,toY(c.high)-8);
      ctx.lineTo(x-7,toY(c.high)-18);
      ctx.lineTo(x+7,toY(c.high)-18);
    }
    ctx.fill();
    // Label badge
    const lW=34,lH=16,lX=x-lW/2,lY=isBuy?toY(c.low)+22:toY(c.high)-40;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.roundRect(lX,lY,lW,lH,3);
    ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 9px 'Orbitron'";
    ctx.textAlign="center";
    ctx.fillText(lastSig.signal,x,lY+11);
    ctx.textAlign="left";
  }

  // SL / TP lines
  if(lastSig&&lastSig.signal!=="WAIT"){
    const drawLevel=(price,col,label)=>{
      const y=toY(price);
      if(y<pad.t||y>H-pad.b)return;
      ctx.strokeStyle=col+"99"; ctx.lineWidth=1; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=col; ctx.font="8px 'Share Tech Mono'";
      ctx.fillText(label,W-pad.r+4,y+3);
    };
    drawLevel(lastSig.sl,"#ef5350","SL");
    drawLevel(lastSig.tp1,"#26a69a","TP1");
    drawLevel(lastSig.tp2,"#00e676","TP2");
  }

  // Current price line
  if(ticks.length>0){
    const cur=ticks[ticks.length-1];
    const y=toY(cur);
    if(y>=pad.t&&y<=H-pad.b){
      ctx.strokeStyle="#d1d4dc55"; ctx.lineWidth=1; ctx.setLineDash([2,4]);
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
      ctx.setLineDash([]);
      // Price tag
      ctx.fillStyle="#2a2e39";
      ctx.fillRect(W-pad.r,y-8,58,16);
      ctx.strokeStyle="#d1d4dc55"; ctx.lineWidth=1;
      ctx.strokeRect(W-pad.r,y-8,58,16);
      ctx.fillStyle="#d1d4dc"; ctx.font="9px 'Share Tech Mono'";
      ctx.fillText(cur.toFixed(2),W-pad.r+3,y+3);
    }
  }
}

// ── UI Updates ────────────────────────────────────────────
function updateUI(sig, price, prevPrice){
  // Price
  document.getElementById('live-price').textContent = price.toFixed(2);
  const ch = price - (prevPrice||price);
  const chPct = prevPrice ? ((ch/prevPrice)*100).toFixed(2) : "0.00";
  const chEl = document.getElementById('price-change');
  chEl.textContent = `${ch>=0?"+":""}${ch.toFixed(2)} (${ch>=0?"+":""}${chPct}%)`;
  chEl.className = ch>=0?"up":"dn";

  if(!sig)return;
  lastSig = sig;

  // Signal badge
  const badge = document.getElementById('sig-badge');
  badge.textContent = sig.signal==="BUY"?"▲ BUY":sig.signal==="SELL"?"▼ SELL":"◉ WAIT";
  badge.className = "sig-badge " + (sig.signal==="BUY"?"sig-buy":sig.signal==="SELL"?"sig-sell":"sig-wait");
  document.getElementById('sig-info').innerHTML =
    `Confidence: <b>${sig.confidence}%</b> · ${sig.pd.zone}<br>Bull ${sig.bull}pt · Bear ${sig.bear}pt`;

  // Levels
  if(sig.signal!=="WAIT"){
    document.getElementById('lv-entry').textContent = sig.entry.toFixed(2);
    document.getElementById('lv-sl').textContent = sig.sl.toFixed(2);
    document.getElementById('lv-tp1').textContent = sig.tp1.toFixed(2);
    document.getElementById('lv-tp2').textContent = sig.tp2.toFixed(2);
  }

  // Reasons
  const r = document.getElementById('reasons');
  r.innerHTML = sig.reasons.map(x=>
    `<div class="reason ${x.s==="bull"?"r-bull":"r-bear"}">
      <span>${x.s==="bull"?"▲":"▼"}</span><span>${x.t}</span>
    </div>`
  ).join('') || `<div style="color:#4a5060;font-size:10px;padding:6px">No confluences yet...</div>`;
}

// ── Candle Builder ────────────────────────────────────────
function setTF(n){
  currentTF=n;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tf'+n).classList.add('active');
  candles=[]; candleBuilder={open:null,high:-Infinity,low:Infinity,close:null,count:0,time:null};
  drawChart();
}

function buildCandle(price, time){
  const c=candleBuilder;
  if(c.open===null){
    Object.assign(c,{open:price,high:price,low:price,close:price,count:1,time});
    return;
  }
  c.high=Math.max(c.high,price); c.low=Math.min(c.low,price);
  c.close=price; c.count++;
  if(c.count>=currentTF){
    candles.push({open:c.open,high:c.high,low:c.low,close:c.close,time:c.time});
    if(candles.length>200)candles.shift();
    const sig=runSMC(candles);
    const prev=ticks.length>1?ticks[ticks.length-2]:price;
    updateUI(sig,price,prev);
    drawChart();
    Object.assign(c,{open:null,high:-Infinity,low:Infinity,close:null,count:0});
  }
}

// ── WebSocket ─────────────────────────────────────────────
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen=()=>{
    ws.send(JSON.stringify({authorize: API_TOKEN}));
  };
  ws.onmessage=(e)=>{
    const msg=JSON.parse(e.data);
    if(msg.msg_type==="authorize"){
      if(msg.error){
        document.getElementById('status-dot').className='status-dot dot-err';
        document.getElementById('status-txt').textContent='AUTH ERROR — Check Token';
        return;
      }
      ws.send(JSON.stringify({ticks:SYMBOL,subscribe:1}));
      document.getElementById('status-dot').className='status-dot dot-live';
      document.getElementById('status-txt').textContent='LIVE';
    }
    if(msg.msg_type==="tick"){
      const t=msg.tick;
      ticks.push(t.quote);
      if(ticks.length>500)ticks.shift();
      document.getElementById('tick-count').textContent=ticks.length+' ticks';
      buildCandle(t.quote, t.epoch*1000);
      // Redraw every tick for sparkle effect
      if(candles.length>0)drawChart();
    }
  };
  ws.onerror=()=>{
    document.getElementById('status-dot').className='status-dot dot-err';
    document.getElementById('status-txt').textContent='ERROR — RETRYING...';
  };
  ws.onclose=()=>{
    document.getElementById('status-dot').className='status-dot dot-conn';
    document.getElementById('status-txt').textContent='RECONNECTING...';
    setTimeout(connect,3000);
  };
  setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({ping:1}));},30000);
}

resizeCanvas();
connect();
</script>
