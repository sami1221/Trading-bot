<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gold Signal Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --gold: #D4A017;
    --gold-light: #F5C842;
    --gold-dim: #8B6914;
    --bg: #0A0A0F;
    --surface: #111118;
    --surface2: #1A1A24;
    --border: #2A2A3A;
    --text: #E8E8F0;
    --muted: #6B6B80;
    --buy: #22C55E;
    --sell: #EF4444;
    --neutral: #F59E0B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo { display: flex; align-items: center; gap: 8px; }

  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
  .logo-text span { color: var(--gold); }

  .live-badge {
    display: flex; align-items: center; gap: 5px;
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.25);
    border-radius: 20px; padding: 4px 10px;
    font-size: 11px; font-weight: 600; color: var(--buy);
    font-family: 'Space Mono', monospace;
  }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--buy); animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  .price-hero {
    margin: 16px;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden; position: relative;
  }

  .price-hero::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .price-input-area { padding: 16px; border-bottom: 1px solid var(--border); }

  .input-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 8px;
  }

  .price-input-row { display: flex; gap: 8px; align-items: center; }

  .price-input-wrap { flex: 1; position: relative; }

  .price-input-wrap .currency {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-family: 'Space Mono', monospace; font-size: 13px;
    color: var(--gold); font-weight: 700;
  }

  .price-field {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: 'Space Mono', monospace;
    font-size: 18px; font-weight: 700;
    padding: 10px 12px 10px 36px; outline: none; transition: border-color 0.2s;
  }

  .price-field:focus { border-color: var(--gold); }
  .price-field::placeholder { color: var(--muted); }

  .analyze-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border: none; border-radius: 10px; color: #000;
    font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700;
    padding: 10px 16px; cursor: pointer; white-space: nowrap;
    transition: transform 0.15s, opacity 0.15s;
    display: flex; align-items: center; gap: 6px;
  }

  .analyze-btn:active { transform: scale(0.96); opacity: 0.9; }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .price-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 12px 16px; gap: 8px;
  }

  .stat-item { text-align: center; }

  .stat-label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px;
  }

  .stat-value { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: var(--text); }
  .stat-value.up { color: var(--buy); }
  .stat-value.down { color: var(--sell); }

  .signal-box {
    margin: 0 16px 16px; border-radius: 16px;
    border: 1px solid var(--border); overflow: hidden; display: none;
  }

  .signal-box.visible { display: block; }

  .signal-header {
    padding: 14px 16px; display: flex;
    align-items: center; justify-content: space-between;
  }

  .signal-header.buy { background: rgba(34,197,94,0.1); border-bottom: 1px solid rgba(34,197,94,0.2); }
  .signal-header.sell { background: rgba(239,68,68,0.1); border-bottom: 1px solid rgba(239,68,68,0.2); }
  .signal-header.hold { background: rgba(245,158,11,0.1); border-bottom: 1px solid rgba(245,158,11,0.2); }

  .signal-type { display: flex; align-items: center; gap: 8px; }

  .signal-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }

  .signal-icon.buy { background: rgba(34,197,94,0.2); }
  .signal-icon.sell { background: rgba(239,68,68,0.2); }
  .signal-icon.hold { background: rgba(245,158,11,0.2); }

  .signal-label { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .signal-label.buy { color: var(--buy); }
  .signal-label.sell { color: var(--sell); }
  .signal-label.hold { color: var(--neutral); }

  .confidence-pill {
    font-family: 'Space Mono', monospace; font-size: 12px;
    font-weight: 700; padding: 4px 10px; border-radius: 20px;
  }

  .confidence-pill.buy { background: rgba(34,197,94,0.15); color: var(--buy); border: 1px solid rgba(34,197,94,0.3); }
  .confidence-pill.sell { background: rgba(239,68,68,0.15); color: var(--sell); border: 1px solid rgba(239,68,68,0.3); }
  .confidence-pill.hold { background: rgba(245,158,11,0.15); color: var(--neutral); border: 1px solid rgba(245,158,11,0.3); }

  .levels-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border); border-bottom: 1px solid var(--border);
  }

  .level-cell { background: var(--surface); padding: 12px; text-align: center; }

  .level-name {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--muted); margin-bottom: 4px;
  }

  .level-value { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; }
  .level-value.entry { color: var(--gold); }
  .level-value.tp { color: var(--buy); }
  .level-value.sl { color: var(--sell); }

  .analysis-body { padding: 14px 16px; background: var(--surface); }

  .analysis-text { font-size: 13px; line-height: 1.7; color: #B0B0C0; }

  .section-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--muted);
    margin: 16px 16px 8px;
    display: flex; align-items: center; gap: 8px;
  }

  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .news-list { margin: 0 16px; display: flex; flex-direction: column; gap: 8px; }

  .news-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; cursor: pointer; transition: border-color 0.2s;
  }

  .news-item:active { border-color: var(--gold); }

  .news-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }

  .news-source {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--gold);
  }

  .news-time { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; }
  .news-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }

  .news-headline { font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--text); margin-bottom: 6px; }

  .news-sentiment {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
  }

  .news-sentiment.bullish { background: rgba(34,197,94,0.1); color: var(--buy); }
  .news-sentiment.bearish { background: rgba(239,68,68,0.1); color: var(--sell); }
  .news-sentiment.neutral { background: rgba(107,107,128,0.15); color: var(--muted); }

  .loading-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(10,10,15,0.85); backdrop-filter: blur(8px);
    z-index: 200; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }

  .loading-overlay.visible { display: flex; }

  .loader-ring {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--gold);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text { font-size: 13px; color: var(--muted); font-family: 'Space Mono', monospace; }

  .error-msg {
    margin: 0 16px;
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: 12px; padding: 12px 14px;
    font-size: 13px; color: #FF9090; display: none;
  }

  .error-msg.visible { display: block; }

  .spacer { height: 24px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,15,0.97);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  }

  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px; padding: 6px;
    cursor: pointer; opacity: 0.4; transition: opacity 0.2s;
  }

  .nav-item.active { opacity: 1; }
  .nav-item .nav-icon { font-size: 20px; }
  .nav-item .nav-label { font-size: 10px; font-weight: 600; color: var(--gold); }

  .content-pad { padding-bottom: 70px; }

  .btn-spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.3); border-top-color: #000;
    border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loader-ring"></div>
  <div class="loader-text">Analyzing Gold Market...</div>
</div>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🥇</div>
    <div class="logo-text">Gold<span>Signal</span></div>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE
  </div>
</div>

<div class="content-pad">

  <div class="price-hero">
    <div class="price-input-area">
      <div class="input-label">Enter Current Gold Price (XAU/USD)</div>
      <div class="price-input-row">
        <div class="price-input-wrap">
          <span class="currency">$</span>
          <input
            type="number"
            class="price-field"
            id="priceInput"
            placeholder="3,350.00"
            step="0.01"
            min="0"
          />
        </div>
        <button class="analyze-btn" id="analyzeBtn" onclick="runAnalysis()">
          <div class="btn-spinner" id="btnSpinner"></div>
          <span id="btnText">⚡ Analyze</span>
        </button>
      </div>
    </div>
    <div class="price-stats">
      <div class="stat-item">
        <div class="stat-label">Entry</div>
        <div class="stat-value" id="entryDisplay">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Change</div>
        <div class="stat-value" id="changeDisplay">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Session</div>
        <div class="stat-value" id="sessionDisplay">—</div>
      </div>
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="signal-box" id="signalBox">
    <div class="signal-header" id="signalHeader">
      <div class="signal-type">
        <div class="signal-icon" id="signalIcon"></div>
        <div class="signal-label" id="signalLabel"></div>
      </div>
      <div class="confidence-pill" id="confidencePill"></div>
    </div>
    <div class="levels-grid">
      <div class="level-cell">
        <div class="level-name">Entry</div>
        <div class="level-value entry" id="entryLevel">—</div>
      </div>
      <div class="level-cell">
        <div class="level-name">Take Profit</div>
        <div class="level-value tp" id="tpLevel">—</div>
      </div>
      <div class="level-cell">
        <div class="level-name">Stop Loss</div>
        <div class="level-value sl" id="slLevel">—</div>
      </div>
    </div>
    <div class="analysis-body">
      <div class="analysis-text" id="analysisText"></div>
    </div>
  </div>

  <div class="section-title">Market News</div>
  <div class="news-list" id="newsList">
    <div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">
      Enter a price and tap Analyze to load news
    </div>
  </div>

  <div class="spacer"></div>
</div>

<div class="bottom-nav">
  <div class="nav-item active">
    <div class="nav-icon">📊</div>
    <div class="nav-label">Signal</div>
  </div>
  <div class="nav-item">
    <div class="nav-icon">📰</div>
    <div class="nav-label">News</div>
  </div>
  <div class="nav-item">
    <div class="nav-icon">📈</div>
    <div class="nav-label">History</div>
  </div>
  <div class="nav-item">
    <div class="nav-icon">⚙️</div>
    <div class="nav-label">Settings</div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//  ⚠️  API KEY — ይህን ብቻ ቀይር
//  sk-ant-api03-XXXXXXXXXXXXXXXXXXXXXXXX ብለህ ጻፍ
// ════════════════════════════════════════════════
const API_KEY = 'sk-ant-api03-PASTE_YOUR_KEY_HERE';

// ─── Telegram WebApp init ───────────────────────
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  document.body.style.background = tg.themeParams?.bg_color || '#0A0A0F';
}

// ─── Session info ───────────────────────────────
function getSession() {
  const h = new Date().getUTCHours();
  if (h >= 22 || h < 8)  return { label: 'ASIA',   color: '#60A5FA' };
  if (h >= 8  && h < 13) return { label: 'LONDON', color: '#A78BFA' };
  return                          { label: 'NY',     color: '#34D399' };
}

// ─── Main analysis ──────────────────────────────
async function runAnalysis() {
  const priceRaw = document.getElementById('priceInput').value.trim();
  const price = parseFloat(priceRaw);

  if (!priceRaw || isNaN(price) || price <= 0) {
    showError('Please enter a valid gold price (e.g. 3350.50)');
    return;
  }

  hideError();
  setLoading(true);

  const session = getSession();
  document.getElementById('entryDisplay').textContent = '$' + price.toFixed(2);
  document.getElementById('sessionDisplay').textContent = session.label;
  document.getElementById('sessionDisplay').style.color = session.color;

  const prompt = `You are a professional gold (XAU/USD) trading analyst. The current gold price is $${price.toFixed(2)}.

Analyze this price and provide a trading signal. Think about:
- Key technical levels (support/resistance at round numbers, recent pivots)
- Current market context for gold (USD strength, interest rates, geopolitical factors)
- Session timing (${session.label} session)
- Risk/reward setup

Respond ONLY with a JSON object, no markdown, no explanation outside JSON:
{
  "signal": "BUY" | "SELL" | "HOLD",
  "confidence": 65-95,
  "entry": number,
  "takeProfit": number,
  "stopLoss": number,
  "analysis": "2-3 sentence analysis explaining the signal rationale",
  "priceChange": "+0.45%" or "-0.32%" (estimated daily change),
  "news": [
    {"headline": "string","source": "Reuters|Bloomberg|FXStreet|Kitco|CNBC","time": "Xh ago","sentiment": "bullish|bearish|neutral"},
    {"headline": "string","source": "string","time": "string","sentiment": "bullish|bearish|neutral"},
    {"headline": "string","source": "string","time": "string","sentiment": "bullish|bearish|neutral"},
    {"headline": "string","source": "string","time": "string","sentiment": "bullish|bearish|neutral"}
  ]
}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,                                    // ← KEY
        'anthropic-version': '2023-06-01',                       // ← REQUIRED
        'anthropic-dangerous-direct-browser-access': 'true'      // ← REQUIRED for browser
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(errData?.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const raw = data.content.map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);

    renderSignal(result, price);
    renderNews(result.news || []);

    if (window.Telegram?.WebApp?.HapticFeedback) {
      window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
    }

  } catch (err) {
    console.error(err);
    showError('Analysis failed: ' + err.message);
  } finally {
    setLoading(false);
  }
}

// ─── Render signal ──────────────────────────────
function renderSignal(r, price) {
  const sig = r.signal?.toUpperCase() || 'HOLD';
  const conf = r.confidence || 70;
  const icons = { BUY: '📈', SELL: '📉', HOLD: '⏸️' };
  const classes = { BUY: 'buy', SELL: 'sell', HOLD: 'hold' };
  const cls = classes[sig] || 'hold';

  document.getElementById('signalBox').classList.add('visible');
  document.getElementById('signalHeader').className = `signal-header ${cls}`;
  document.getElementById('signalIcon').className = `signal-icon ${cls}`;
  document.getElementById('signalIcon').textContent = icons[sig];
  document.getElementById('signalLabel').className = `signal-label ${cls}`;
  document.getElementById('signalLabel').textContent = sig;

  const pill = document.getElementById('confidencePill');
  pill.className = `confidence-pill ${cls}`;
  pill.textContent = `${conf}% conf.`;

  document.getElementById('entryLevel').textContent = '$' + (r.entry || price).toFixed(2);
  document.getElementById('tpLevel').textContent   = '$' + (r.takeProfit || price).toFixed(2);
  document.getElementById('slLevel').textContent   = '$' + (r.stopLoss || price).toFixed(2);
  document.getElementById('analysisText').textContent = r.analysis || '';

  const change = r.priceChange || '—';
  const changeEl = document.getElementById('changeDisplay');
  changeEl.textContent = change;
  changeEl.className = 'stat-value ' + (change.startsWith('+') ? 'up' : change.startsWith('-') ? 'down' : '');
}

// ─── Render news ────────────────────────────────
function renderNews(news) {
  const list = document.getElementById('newsList');
  if (!news.length) {
    list.innerHTML = '<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">No news available</div>';
    return;
  }
  list.innerHTML = news.map(n => `
    <div class="news-item">
      <div class="news-meta">
        <span class="news-source">${escHtml(n.source)}</span>
        <div class="news-dot"></div>
        <span class="news-time">${escHtml(n.time)}</span>
      </div>
      <div class="news-headline">${escHtml(n.headline)}</div>
      <span class="news-sentiment ${escHtml(n.sentiment)}">
        ${n.sentiment === 'bullish' ? '🟢 Bullish' : n.sentiment === 'bearish' ? '🔴 Bearish' : '⚪ Neutral'}
      </span>
    </div>
  `).join('');
}

// ─── Helpers ────────────────────────────────────
function setLoading(on) {
  document.getElementById('analyzeBtn').disabled = on;
  document.getElementById('btnSpinner').style.display = on ? 'block' : 'none';
  document.getElementById('btnText').textContent = on ? 'Analyzing…' : '⚡ Analyze';
  document.getElementById('loadingOverlay').classList.toggle('visible', on);
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('visible');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('visible');
}

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}

document.getElementById('priceInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runAnalysis();
});
</script>
</body>
</html>
